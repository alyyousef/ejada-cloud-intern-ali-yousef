apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: week3-demo
  labels:
    app: demo-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      initContainers:
        - name: write-index
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              cat <<EOF > /data/index.html
              <html>
                <head><title>Ejada Week 3 - OKE Demo</title></head>
                <body style="font-family: sans-serif;">
                  <h1>Ejada Internship - Week 3 OKE Lab</h1>
                  <p>Served by pod: $(hostname)</p>
                  <p>Node: $NODE_NAME</p>
                  <p>Rendered at container start: $(date -u)</p>
                  <p>This page is being read from a PersistentVolumeClaim backed
                     by an OCI block volume, attached via the CSI driver.</p>
                </body>
              </html>
              EOF
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: demo-app-data
